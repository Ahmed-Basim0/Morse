// مولّد QR مصغّر (وضع البايت، تصحيح M، إصدارات 1-6): qrUrl(text) يعيد صورة SVG جاهزة لـ <img>
function qrMatrix(text){
  const d=[...new TextEncoder().encode(text)],EC=[0,10,16,26,18,24,16],NB=[0,1,1,1,2,2,4];
  let v=1;while(v<=6&&Math.floor(((16*v+128)*v+64-(v>1?(25*(Math.floor(v/7)+2)-10)*(Math.floor(v/7)+2)-55:0))/8)-EC[v]*NB[v]<d.length+2)v++;
  if(v>6)throw Error('QR: النص طويل');
  const n=v*4+17,raw=Math.floor(((16*v+128)*v+64-(v>1?(25*2-10)*2-55:0))/8),ne=EC[v],nb=NB[v],cap=raw-ne*nb;
  let b=[];const put=(x,l)=>{for(let i=l-1;i>=0;i--)b.push((x>>>i)&1)};
  put(4,4);put(d.length,8);d.forEach(x=>put(x,8));
  for(let i=0;i<4&&b.length<cap*8;i++)b.push(0);
  while(b.length%8)b.push(0);
  const cw=[];for(let i=0;i<b.length;i+=8)cw.push(parseInt(b.slice(i,i+8).join(''),2));
  for(let p=0xEC;cw.length<cap;p^=0xEC^0x11)cw.push(p);
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
  const gen=[...Array(ne-1).fill(0),1];
  for(let i=0,r=1;i<ne;i++){for(let j=0;j<ne;j++){gen[j]=mul(gen[j],r);if(j+1<ne)gen[j]^=gen[j+1]}r=mul(r,2)}
  const rs=a=>{const r=Array(ne).fill(0);for(const x of a){const f=x^r.shift();r.push(0);gen.forEach((g,i)=>r[i]^=mul(g,f))}return r};
  const sb=nb-raw%nb,sl=Math.floor(raw/nb),bl=[];
  for(let i=0,k=0;i<nb;i++){const a=cw.slice(k,k+sl-ne+(i<sb?0:1));k+=a.length;const e=rs(a);if(i<sb)a.push(0);bl.push(a.concat(e))}
  const all=[];for(let i=0;i<bl[0].length;i++)bl.forEach((x,j)=>{if(i!=sl-ne||j>=sb)all.push(x[i])});
  const m=Array.from({length:n},()=>Array(n).fill(false)),f=Array.from({length:n},()=>Array(n).fill(false));
  const set=(x,y,c)=>{if(x>=0&&y>=0&&x<n&&y<n){m[y][x]=c;f[y][x]=true}};
  for(let i=0;i<n;i++){set(6,i,i%2==0);set(i,6,i%2==0)}
  for(const [cx,cy] of [[3,3],[n-4,3],[3,n-4]])for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const t=Math.max(Math.abs(dx),Math.abs(dy));set(cx+dx,cy+dy,t!=2&&t!=4)}
  if(v>1){const a=n-7;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(a+dx,a+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1)}
  const fmt=k=>{const x=k;let r=x;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const q=((x<<10)|r)^0x5412,g=i=>((q>>>i)&1)==1;
    for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
    for(let i=0;i<8;i++)set(n-1-i,8,g(i));for(let i=8;i<15;i++)set(8,n-15+i,g(i));set(8,n-8,true)};
  fmt(0);
  let i=0;for(let r=n-1;r>=1;r-=2){if(r==6)r=5;for(let t=0;t<n;t++)for(let j=0;j<2;j++){const x=r-j,y=((r+1)&2)==0?n-1-t:t;if(!f[y][x]&&i<all.length*8){m[y][x]=((all[i>>>3]>>>(7-(i&7)))&1)==1;i++}}}
  const mk=[(x,y)=>(x+y)%2==0,(x,y)=>y%2==0,(x,y)=>x%3==0,(x,y)=>(x+y)%3==0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2==0,(x,y)=>x*y%2+x*y%3==0,(x,y)=>(x*y%2+x*y%3)%2==0,(x,y)=>((x+y)%2+x*y%3)%2==0];
  const pen=g=>{let p=0;for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(x+1<n&&y+1<n&&g[y][x]==g[y][x+1]&&g[y][x]==g[y+1][x]&&g[y][x]==g[y+1][x+1])p+=3}
    for(const T of [0,1])for(let a=0;a<n;a++){let run=1;for(let c=1;c<=n;c++){const s=c<n&&(T?g[c][a]==g[c-1][a]:g[a][c]==g[a][c-1]);if(s)run++;else{if(run>=5)p+=run-2;run=1}}}return p};
  let best=null,bp=1e9,bm=0;
  for(let k=0;k<8;k++){const g=m.map((row,y)=>row.map((c,x)=>f[y][x]?c:c!=mk[k](x,y)));const p=pen(g);if(p<bp){bp=p;best=g;bm=k}}
  m.forEach((row,y)=>row.forEach((_,x)=>m[y][x]=best[y][x]));
  fmt(bm);return m}
function qrUrl(t){const m=qrMatrix(t),n=m.length+8;let p='';
  m.forEach((r,y)=>r.forEach((c,x)=>{if(c)p+='M'+(x+4)+' '+(y+4)+'h1v1h-1z'}));
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+n+' '+n+'" shape-rendering="crispEdges"><rect width="'+n+'" height="'+n+'" fill="#fff"/><path d="'+p+'" fill="#000"/></svg>')}
function renderDonate(){const on=DONATE_SHOW&&DONATE.length;$('bg').hidden=!on;if(!on){$('dnp').hidden=true;return}
const box=$('dnl'),el=(t,x,c)=>{const e=document.createElement(t);if(x!=null)e.textContent=x;if(c)e.className=c;return e},mk=(k,f)=>{const b=el('button',tr(k),'c');b.dataset.i=k;b.onclick=()=>f(b);return b};
box.textContent='';
for(const d of DONATE){const row=el('div',null,'dn');row.append(el('b',d.n));if(d.t)row.append(el('small',d.t));
if(d.v)row.append(el('code',d.v),mk('cpy',b=>copyTxt(d.v,b)));
if(d.u&&/^https:\/\//.test(d.u))row.append(mk('dopen',()=>window.open(d.u,'_blank','noopener')));
let qs=null;try{qs=d.qr?qrUrl(typeof d.qr==='string'?d.qr:d.v):(d.q&&/^data:image\/(png|jpeg|webp);base64,/.test(d.q)?d.q:null)}catch(e){}
if(qs){const im=el('img',null,'dq');im.src=qs;im.alt='QR';row.append(im)}
box.append(row)}}
