    const response = await fetch(authUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ returnSecureToken: true })
    });
    const data = await response.json();
    if (data.idToken) {
      idToken = data.idToken;refreshTok=data.refreshToken;uid=data.localId;tokExp=Date.now()+(+data.expiresIn||3600)*1000;

      return false;
    }

    console.error("Auth server error:", error);
    return false;
  }
}

const rs=await Promise.all(Array.from({length:12},(_,i)=>readSlot(b,i+1)));

const its=code?[{ch:str,c:code}]:[...str.toUpperCase()].map(ch=>({ch,c:ALL[ch]}));
for(const{ch,c}of its){if(ch===' '||ch==='\n'){ev.push({p:4*ta},{sp:1});continue}if(!c)continue;
[...c].forEach((x,i)=>{if(i)ev.push({p:u});ev.push({on:x,d:x==='.'?u:3*u})});ev.push({lab:ch},{p:3*ta})}
if(!ev.length)return;plOn=true;$('stp').hidden=false;

if(e.on){tone(true);tapeDown();plT=setTimeout(()=>{tone(false);tapeUp(e.on);go(i+1)},e.d)}

let obI=0;
const obAll=q=>document.querySelectorAll('#onb '+q);
function obMark(){obAll('[data-lg]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lg===lang)));const c=theme||'auto';obAll('[data-th]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.th===c)))}
function obShow(n){obI=n;obAll('.ob').forEach((e,i)=>e.hidden=i!==n);obAll('#obd i').forEach((e,i)=>e.classList.toggle('on',i===n));$('obnext').textContent=tr(n===2?'obStart':'obNext');$('obskip').hidden=n===2}
function obEnd(){onb=true;saveS();$('onb').hidden=true;document.body.style.overflow=''}
obAll('[data-lg]').forEach(b=>b.onclick=()=>{lang=b.dataset.lg;applyLang();saveS();obMark();obShow(obI)});
obAll('[data-th]').forEach(b=>b.onclick=()=>{theme=b.dataset.th==='auto'?null:b.dataset.th;applyTheme();saveS();obMark()});
$('obnext').onclick=()=>{obI<2?obShow(obI+1):obEnd()};$('obskip').onclick=obEnd;
render();applyLang();syncX();applyTouch();applyTheme();tapeSize();
if(!onb){$('onb').hidden=false;document.body.style.overflow='hidden';obMark();obShow(0)}
</script>
</body>
</html>
